<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>研究报告 — Alex Chen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Karla:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f7f5f0;
      --bg-warm:#f2efe8;
      --surface:#ffffff;
      --surface-muted:#ece9e1;
      --border:#ddd8ce;
      --border-light:#eae6de;
      --text:#2c2a25;
      --text-secondary:#8a847a;
      --text-tertiary:#b5afa5;
      --accent:#6b7c6e;
      --accent-light:#8a9b8d;
      --accent-faint:rgba(107,124,110,.08);
      --radius:6px;
      --font-display:'Cormorant Garamond','Noto Serif SC',Georgia,serif;
      --font-body:'Karla','Noto Sans SC',system-ui,sans-serif;
    }
    html{scroll-behavior:smooth;font-size:16px}
    body{
      font-family:var(--font-body);
      background:var(--bg);color:var(--text);
      line-height:1.75;font-weight:400;
      -webkit-font-smoothing:antialiased;
    }
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    ::selection{background:var(--accent);color:#fff}

    /* ─── NAV ─── */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:100;
      padding:1.2rem 3rem;
      background:rgba(247,245,240,.88);
      backdrop-filter:blur(24px) saturate(1.2);
      border-bottom:1px solid var(--border-light);
      display:flex;align-items:center;justify-content:space-between;
    }
    .nav-logo{
      font-family:var(--font-display);
      font-size:1.3rem;font-weight:400;letter-spacing:.02em;
    }
    .nav-logo a{color:inherit;text-decoration:none}
    .nav-back{
      font-size:.78rem;font-weight:500;color:var(--text-secondary);
      letter-spacing:.06em;text-transform:uppercase;
      transition:color .3s;
    }
    .nav-back:hover{color:var(--text);text-decoration:none}

    /* ─── PROGRESS ─── */
    .progress-bar{
      position:fixed;top:0;left:0;height:2px;z-index:200;
      background:var(--accent);width:0;
      transition:width .15s;opacity:.6;
    }

    /* ─── ARTICLE ─── */
    .article-container{
      max-width:740px;margin:0 auto;
      padding:8rem 2rem 5rem;
    }

    /* ─── LOADING ─── */
    .loading{
      text-align:center;padding:6rem 0;color:var(--text-tertiary);
    }
    .loading .spinner{
      width:20px;height:20px;
      border:1.5px solid var(--border-light);
      border-top-color:var(--accent);border-radius:50%;
      animation:spin .8s linear infinite;
      margin:0 auto 1.2rem;
    }
    .loading p{font-size:.85rem;font-weight:300}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ─── MARKDOWN STYLES ─── */
    .markdown-body{
      animation:fadeIn .6s cubic-bezier(.25,.46,.45,.94);
    }
    @keyframes fadeIn{
      from{opacity:0;transform:translateY(12px)}
      to{opacity:1;transform:translateY(0)}
    }

    .markdown-body h1{
      font-family:var(--font-display);
      font-size:2.4rem;font-weight:300;
      letter-spacing:-.02em;line-height:1.2;
      margin-bottom:1rem;color:var(--text);
      padding-bottom:1.5rem;
      border-bottom:1px solid var(--border-light);
    }
    .markdown-body h2{
      font-family:var(--font-display);
      font-size:1.6rem;font-weight:400;
      letter-spacing:-.01em;
      margin-top:3.5rem;margin-bottom:1rem;
      padding-bottom:.6rem;
      border-bottom:1px solid var(--border-light);
      color:var(--text);
    }
    .markdown-body h3{
      font-family:var(--font-display);
      font-size:1.15rem;font-weight:500;
      margin-top:2.5rem;margin-bottom:.6rem;
      color:var(--accent);
    }
    .markdown-body h4{
      font-family:var(--font-body);
      font-size:.9rem;font-weight:600;
      letter-spacing:.03em;
      margin-top:1.8rem;margin-bottom:.5rem;
      color:var(--text);
    }
    .markdown-body p{
      margin-bottom:1.2rem;font-size:.92rem;
      font-weight:300;line-height:1.9;color:var(--text);
    }
    .markdown-body ul,.markdown-body ol{
      margin-bottom:1.2rem;padding-left:1.5rem;
    }
    .markdown-body li{
      margin-bottom:.4rem;font-size:.92rem;
      font-weight:300;line-height:1.8;
    }
    .markdown-body blockquote{
      border-left:2px solid var(--accent);
      padding:.8rem 1.5rem;margin:2rem 0;
      background:var(--accent-faint);
      font-style:italic;
    }
    .markdown-body blockquote p{
      margin-bottom:.3rem;color:var(--text-secondary);
      font-size:.88rem;
    }
    .markdown-body code{
      background:var(--bg-warm);
      padding:.15rem .4rem;border-radius:3px;
      font-size:.82rem;
      font-family:'SF Mono','Fira Code','Consolas',monospace;
      border:1px solid var(--border-light);
      color:var(--text-secondary);
    }
    .markdown-body pre{
      background:var(--surface);
      border:1px solid var(--border-light);
      border-radius:var(--radius);
      padding:1.5rem;margin:2rem 0;overflow-x:auto;
    }
    .markdown-body pre code{
      background:none;padding:0;border:none;
      font-size:.8rem;line-height:1.7;color:var(--text-secondary);
    }
    .markdown-body table{
      width:100%;border-collapse:collapse;
      margin:2rem 0;font-size:.84rem;
    }
    .markdown-body thead th{
      text-align:left;padding:.6rem .8rem;
      border-bottom:2px solid var(--border);
      font-weight:500;font-size:.75rem;
      letter-spacing:.06em;text-transform:uppercase;
      color:var(--text-secondary);
    }
    .markdown-body tbody td{
      padding:.6rem .8rem;
      border-bottom:1px solid var(--border-light);
      color:var(--text);font-weight:300;
      vertical-align:top;
    }
    .markdown-body tbody tr:hover{background:var(--accent-faint)}
    .markdown-body strong{font-weight:500;color:var(--text)}
    .markdown-body em{color:var(--text-secondary)}
    .markdown-body hr{
      border:none;height:1px;background:var(--border-light);
      margin:3rem 0;
    }
    .markdown-body img{
      max-width:100%;border-radius:var(--radius);margin:1.5rem 0;
    }
    .markdown-body a{
      color:var(--accent);
      text-decoration:underline;
      text-decoration-color:var(--border);
      text-underline-offset:3px;
      transition:text-decoration-color .3s;
    }
    .markdown-body a:hover{
      text-decoration-color:var(--accent);
    }

    /* ─── TOC ─── */
    .toc-sidebar{
      position:fixed;top:6rem;right:2.5rem;width:200px;
      max-height:calc(100vh - 8rem);overflow-y:auto;
      font-size:.72rem;line-height:1.6;
      display:none;
    }
    @media(min-width:1200px){.toc-sidebar{display:block}}
    .toc-sidebar .toc-title{
      font-family:var(--font-body);
      font-weight:500;font-size:.65rem;
      letter-spacing:.12em;text-transform:uppercase;
      color:var(--text-tertiary);margin-bottom:1rem;
    }
    .toc-sidebar a{
      display:block;padding:.25rem 0 .25rem 1rem;
      color:var(--text-tertiary);
      border-left:1px solid var(--border-light);
      transition:all .3s;font-weight:300;
      font-size:.72rem;
    }
    .toc-sidebar a:hover,.toc-sidebar a.active{
      color:var(--accent);border-left-color:var(--accent);
      text-decoration:none;
    }
    .toc-sidebar a.toc-h3{padding-left:1.8rem;font-size:.68rem}

    /* ─── FOOTER ─── */
    footer{
      padding:4rem 3rem;border-top:1px solid var(--border-light);
      display:flex;align-items:center;justify-content:space-between;
      max-width:740px;margin:0 auto;
    }
    footer p{color:var(--text-tertiary);font-size:.75rem;letter-spacing:.04em}
    .deerflow-mark{
      font-size:.7rem;color:var(--text-tertiary);
      letter-spacing:.08em;opacity:.6;transition:opacity .3s;
    }
    .deerflow-mark:hover{opacity:1;color:var(--accent);text-decoration:none}

    @media(max-width:768px){
      nav{padding:1rem 1.5rem}
      .article-container{padding:6rem 1.2rem 3rem}
      .markdown-body h1{font-size:1.7rem}
      .markdown-body h2{font-size:1.3rem}
      .markdown-body table{font-size:.76rem}
      .markdown-body thead th,.markdown-body tbody td{padding:.4rem .5rem}
      footer{padding:3rem 1.5rem;flex-direction:column;gap:1rem;text-align:center}
    }
  </style>
</head>
<body>

<div class="progress-bar" id="progressBar"></div>

<nav>
  <div class="nav-logo"><a href="index.html">Alex Chen</a></div>
  <a href="index.html#research" class="nav-back">← Back</a>
</nav>

<div class="toc-sidebar" id="toc"></div>

<main class="article-container">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>
  <article class="markdown-body" id="content" style="display:none"></article>
</main>

<footer>
  <p>© 2026 Alex Chen</p>
  <a href="https://deerflow.tech" target="_blank" class="deerflow-mark" title="Created by Deerflow">DEERFLOW</a>
</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get('file');

  if (file && file.endsWith('.md') && !file.includes('..')) {
    fetch('reports/' + encodeURI(file).replace(/%2F/g, '/'))
      .then(r => {
        if (!r.ok) throw new Error('Not found');
        return r.text();
      })
      .then(md => {
        const html = marked.parse(md);
        const content = document.getElementById('content');
        const loading = document.getElementById('loading');
        content.innerHTML = html;
        content.style.display = 'block';
        loading.style.display = 'none';

        const h1 = content.querySelector('h1');
        if (h1) document.title = h1.textContent + ' — Alex Chen';

        buildTOC();
      })
      .catch(() => {
        document.getElementById('loading').innerHTML =
          '<p style="color:var(--text-secondary)">报告加载失败，请返回<a href="index.html#research" style="color:var(--accent)">首页</a>重试。</p>';
      });
  } else {
    window.location.href = 'index.html#research';
  }

  function buildTOC() {
    const headings = document.querySelectorAll('.markdown-body h2, .markdown-body h3');
    if (headings.length < 3) return;
    const toc = document.getElementById('toc');
    let html = '<div class="toc-title">Contents</div>';
    headings.forEach((h, i) => {
      const id = 'heading-' + i;
      h.id = id;
      const cls = h.tagName === 'H3' ? ' class="toc-h3"' : '';
      const text = h.textContent.length > 26 ? h.textContent.slice(0, 26) + '...' : h.textContent;
      html += `<a href="#${id}"${cls}>${text}</a>`;
    });
    toc.innerHTML = html;

    const tocLinks = toc.querySelectorAll('a');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          tocLinks.forEach(l => l.classList.remove('active'));
          const link = toc.querySelector(`a[href="#${e.target.id}"]`);
          if (link) link.classList.add('active');
        }
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    headings.forEach(h => observer.observe(h));
  }

  window.addEventListener('scroll', () => {
    const bar = document.getElementById('progressBar');
    const scrollTop = document.documentElement.scrollTop;
    const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = scrollHeight > 0 ? (scrollTop / scrollHeight * 100) + '%' : '0';
  });
</script>
</body>
</html>
